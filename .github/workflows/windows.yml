name: Build Windows app

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        working-directory: windows
        run: dotnet publish Lumen.csproj -c Release -o ../out -p:Version=${{ env.VERSION }} -p:DebugType=none

      - name: Add mpv (libmpv)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest Windows build of libmpv from shinchiro/mpv-winbuild-cmake (x86-64, works on any 64-bit PC).
          $rel = gh api repos/shinchiro/mpv-winbuild-cmake/releases/latest | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-[0-9].*\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "No libmpv build found in $($rel.tag_name)" }
          Write-Host "libmpv: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv.7z
          7z x mpv.7z -ompv -y | Out-Null
          Copy-Item mpv/libmpv-2.dll out/
          "libmpv: $($asset.name)" | Out-File out/THIRD-PARTY.txt
          "mpv is licensed under the GPLv2+/LGPLv2.1+, see https://github.com/mpv-player/mpv" | Out-File out/THIRD-PARTY.txt -Append

      - name: Package
        shell: pwsh
        run: |
          Get-ChildItem out | Format-Table Name, Length
          Compress-Archive -Path out/* -DestinationPath Lumen-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-windows-${{ env.VERSION }}
          path: Lumen-Windows.zip

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-v${{ env.VERSION }}
          name: Lumen for Windows ${{ env.VERSION }}
          make_latest: false
          files: Lumen-Windows.zip
          body: |
            Unzip anywhere and run **Lumen.exe** (64-bit Windows 10 / 11). It finds your Lumen server on the network,
            or enter its address. Playback uses mpv: HEVC, HDR, Dolby / DTS without transcoding.

      # A fixed download link for the newest build (used by Lumen → Settings → Devices).
      - name: Update the "latest" download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Lumen for Windows (latest)
          make_latest: false
          files: Lumen-Windows.zip
          body: Always the newest Lumen for Windows (currently ${{ env.VERSION }}). Unzip and run Lumen.exe.

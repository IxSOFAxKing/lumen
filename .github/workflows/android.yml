name: Build Android TV app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Your own signing key from repository secrets (see docs/ANDROID_TV.md). Without it the APK is signed
      # with a temporary key: it installs fine, but each update needs the previous version uninstalled.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.LUMEN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lumen.jks"
            echo "LUMEN_KEYSTORE=$RUNNER_TEMP/lumen.jks" >> "$GITHUB_ENV"
            echo "SIGNED_NOTE=Signed with your release key — installs as an update over previous versions." >> "$GITHUB_ENV"
          else
            echo "SIGNED_NOTE=⚠️ Signed with a temporary key (no signing secrets set): uninstall the previous version before installing this one." >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          LUMEN_KEYSTORE_PASSWORD: ${{ secrets.LUMEN_KEYSTORE_PASSWORD }}
          LUMEN_KEY_ALIAS: ${{ secrets.LUMEN_KEY_ALIAS }}
          LUMEN_KEY_PASSWORD: ${{ secrets.LUMEN_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk lumen-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-tv-${{ env.VERSION_NAME }}
          path: lumen-tv.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-v${{ env.VERSION_NAME }}
          name: Lumen for Android TV ${{ env.VERSION_NAME }}
          make_latest: true
          files: lumen-tv.apk
          body: |
            Install on Android TV / Google TV / Fire TV with the **Downloader** app:
            enter `http://<your-lumen-server>:8080/tv.apk` (or this page's `lumen-tv.apk` link).
            Then open Lumen on the TV and connect it to your server.

            ${{ env.SIGNED_NOTE }}
